name: CI

on:
  push:
    branches: [main, fix/supabase-conflicts]
  pull_request:
    branches: [main]

jobs:
  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm install

      - name: Run backend unit tests
        run: npm run test:unit

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    env:
      # Optional repo secrets: when unset, workflows.test.js skips via describe.skip.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm install

      - name: Run backend integration tests
        run: npm run test:integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend .

      - name: Build backend image
        run: docker build -f server/Dockerfile ./server

