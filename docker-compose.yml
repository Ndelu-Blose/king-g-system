services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env.example
    profiles: ["local"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "4173:4173"
    env_file:
      - ./.env.example
    profiles: ["local"]
    depends_on:
      - backend

